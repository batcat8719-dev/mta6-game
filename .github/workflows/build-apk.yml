name: Build MTA 6 Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate MTA 6 App Icon
        run: |
          python3 - << 'EOF'
          import os, struct, zlib
          os.makedirs("app/src/main/res/mipmap-xxxhdpi", exist_ok=True)
          w, h = 192, 192
          def chunk(tag, data):
              return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)
          raw = bytearray()
          for y in range(h):
              raw.append(0)
              for x in range(w):
                  dx, dy = x - 96, y - 96
                  d2 = dx*dx + dy*dy
                  if d2 < 46*46:
                      raw.extend((255, 111, 0, 255))
                  elif d2 < 68*68:
                      raw.extend((204, 255, 0, 255))
                  else:
                      raw.extend((14, 14, 18, 255))
          ihdr = struct.pack("!IIBBBBB", w, h, 8, 6, 0, 0, 0)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(bytes(raw), 9)) + chunk(b"IEND", b"")
          with open("app/src/main/res/mipmap-xxxhdpi/ic_launcher.png", "wb") as f:
              f.write(png)
          EOF

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release-key.jks \
            -storetype PKCS12 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias mta6 \
            -storepass mta6game123 \
            -keypass mta6game123 \
            -dname "CN=MTA6, OU=Game, O=MTA6, C=IN"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload MTA 6 APK
        uses: actions/upload-artifact@v4
        with:
          name: MTA6-Modi-Theft-Auto-V1-APK
          path: app/build/outputs/apk/release/app-release.apk
